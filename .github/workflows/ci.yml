name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix ../core # @peermate/core is linked from ../core
      - run: npm ci
      - run: npm run typecheck
      # Two P2P workers on a local HyperDHT testnet (no internet DHT needed).
      - run: npm run test:p2p

  android-build:
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true # native/arasan (the build script fetches its Fathom submodule)
      - run: native/build-arasan-android.sh
        working-directory: .
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci --prefix ../core
      - run: npm ci
      - run: CI=1 npx expo prebuild -p android --no-install
      - run: ./gradlew assembleDebug --console=plain
        working-directory: app/android
