name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the token can only read the repo (no job writes anything).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix ../core # @peermate/core is linked from ../core
      - run: npm ci
      - run: npm run typecheck
      # Two P2P workers on a local HyperDHT testnet (no internet DHT needed).
      - run: npm run test:p2p

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # native/arasan (the build script fetches its Fathom submodule)
      - run: native/build-arasan-android.sh
        working-directory: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci --prefix ../core
      - run: npm ci
      - run: CI=1 npx expo prebuild -p android --no-install
      - run: ./gradlew assembleDebug --console=plain
        working-directory: app/android
